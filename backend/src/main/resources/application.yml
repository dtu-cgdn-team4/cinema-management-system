# Biến môi trường đọc từ .env (ở gốc repo hoặc trong backend/), xem .env.example
spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: cinema
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cinema_db?serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  flyway:
    # db/seed: dữ liệu mẫu để phát triển, bỏ khi triển khai thật
    locations: classpath:db/migration,classpath:db/seed
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    template:
      # thời gian chờ consumer trả kết quả giữ ghế
      reply-timeout: 10s
    listener:
      simple:
        default-requeue-rejected: false

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt-secret: ${JWT_SECRET}
