spring.application.name=cinema
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinema_db?connectionTimeZone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:PASS_MYSQL_SIEU_BA_KHI_CUA_BAN}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never

