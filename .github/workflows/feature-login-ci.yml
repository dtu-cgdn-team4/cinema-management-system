name: CI - Feature Dang Nhap

on:
  push:
    branches:
      - 'feature/#1_dang-nhap'   # Chỉ chạy khi push vào đúng nhánh của bạn
  pull_request:
    branches:
      - 'feature/#1_dang-nhap'

jobs:
  # 1. Kiểm tra Backend (Java 17 + Spring Boot + Maven: compile & chạy toàn bộ test)
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Compile & Run Backend Tests
        run: mvn -B test

  # 2. Kiểm tra Frontend (React + TypeScript + Vite: kiểm tra kiểu TS & build)
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build
